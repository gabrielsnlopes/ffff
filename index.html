<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211326">
<title>Uma pergunta importante 🍕</title>
<style>
  :root { --pink:#ff83c5; --coral:#ff9678; --cream:#fff3df; --bg:#211326; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden;
    padding:24px; color:var(--cream);
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 35%, #482343 0%, #29182e 48%, #17101f 100%);
  }
  .sparkles { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .sparkle { position:absolute; opacity:0; animation:twinkle var(--duration) ease-in-out infinite; animation-delay:var(--delay); }
  @keyframes twinkle { 0%,100%{opacity:0;transform:scale(.5) rotate(0)} 50%{opacity:.9;transform:scale(1.2) rotate(35deg)} }
  .card {
    width:min(100%,430px); text-align:center; padding:34px 24px 30px;
    border:1px solid #ffffff20; border-radius:30px;
    background:linear-gradient(160deg,#ffffff0d,#ffffff04);
    box-shadow:0 24px 80px #09060e70; position:relative;
    animation:appear .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes appear { from{opacity:0;transform:translateY(20px) scale(.97)} to{opacity:1;transform:none} }
  .pizza { font-size:86px; display:inline-block; filter:drop-shadow(0 10px 18px #ff8b6630); animation:bob 2.5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:rotate(-7deg) translateY(0)} 50%{transform:rotate(7deg) translateY(-9px)} }
  .eyebrow { color:#e9b8dc; text-transform:uppercase; letter-spacing:3px; font-size:11px; font-weight:800; margin:10px 0 14px; }
  h1 { color:var(--pink); font-size:clamp(34px,9vw,47px); line-height:1.08; margin:0 0 13px; letter-spacing:-1.8px; text-shadow:0 0 28px #ff83c533; }
  .subtitle { color:#e8d8e8; font-size:15px; line-height:1.6; margin:0 auto 26px; max-width:290px; }
  .buttons { display:grid; gap:12px; }
  button {
    width:100%; border:0; border-radius:15px; padding:16px 18px; cursor:pointer;
    font:800 16px inherit; font-size:16px; font-weight:800;
    transition:transform .18s, box-shadow .18s, background .18s;
  }
  button:hover { transform:translateY(-2px); }
  button:active { transform:scale(.98); }
  .yes { background:linear-gradient(100deg,var(--pink),var(--coral)); color:#32162c; box-shadow:0 8px 24px #ff83c52b; }
  .sure { background:#ffffff0b; color:#ffe6f4; border:1px solid #ffb5df55; }
  .footer { color:#a98cae; font-size:11px; margin-top:22px; letter-spacing:.5px; }
  #result { display:none; animation:appear .5s ease both; }
  #result .big { font-size:58px; margin:8px 0; }
  #result h2 { color:var(--pink); font-size:29px; margin:8px 0; }
  #result p { color:#f1dff0; line-height:1.6; }
  .again { margin-top:10px; color:#ffe6f4; background:#ffffff10; border:1px solid #ffffff22; }
  .heart { position:fixed; bottom:-35px; pointer-events:none; animation:floatUp 3.2s ease-out forwards; }
  @keyframes floatUp { 0%{opacity:0;transform:translateY(0) rotate(0)} 15%{opacity:1} 100%{opacity:0;transform:translateY(-110vh) rotate(35deg)} }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>
<main class="card">
  <section id="question">
    <div class="pizza" aria-hidden="true">🍕</div>
    <div class="eyebrow">um convite muito sério</div>
    <h1>bora comer<br>pizza?</h1>
    <p class="subtitle">Tenho uma pergunta importante…<br>e espero que a resposta tenha queijo. 🧀</p>
    <div class="buttons">
      <button class="yes" onclick="choose('sim')">Sim! 🍕</button>
      <button class="sure" onclick="choose('certeza')">Com certeza! 💗</button>
    </div>
    <div class="footer">FEITO COM FOME E CARINHO</div>
  </section>
  <section id="result" aria-live="polite">
    <div class="big" id="resultEmoji">🍕💖</div>
    <h2 id="resultTitle">Temos um plano!</h2>
    <p id="resultText">Agora só falta escolher a pizzaria. 😎</p>
    <button class="again" onclick="resetPage()">Voltar à pergunta ↻</button>
  </section>
</main>
<script>
  const sparkleBox = document.getElementById('sparkles');
  const symbols = ['✦','✧','·','♡'];
  for (let i=0; i<34; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.fontSize = (10+Math.random()*17)+'px';
    s.style.color = Math.random()>.5 ? '#ff83c5' : '#ffd6a5';
    s.style.setProperty('--duration',(2+Math.random()*3)+'s');
    s.style.setProperty('--delay',(-Math.random()*5)+'s');
    sparkleBox.appendChild(s);
  }
  function choose(answer) {
    document.getElementById('question').style.display='none';
    document.getElementById('result').style.display='block';
    if (answer === 'certeza') {
      document.getElementById('resultEmoji').textContent='🍕🥳💗';
      document.getElementById('resultTitle').textContent='É essa a atitude!';
      document.getElementById('resultText').textContent='Convite aceite com entusiasmo. Agora só falta escolher a pizzaria!';
    } else {
      document.getElementById('resultEmoji').textContent='🍕💖✨';
      document.getElementById('resultTitle').textContent='Temos um plano!';
      document.getElementById('resultText').textContent='Boa! Agora só falta escolher a pizzaria. 😎';
    }
    for (let i=0;i<24;i++) {
      setTimeout(()=>{
        const h=document.createElement('span');
        h.className='heart';
        h.textContent=['💗','✨','🍕','💕'][Math.floor(Math.random()*4)];
        h.style.left=Math.random()*100+'%';
        h.style.fontSize=(18+Math.random()*22)+'px';
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),3300);
      },i*65);
    }
  }
  function resetPage() {
    document.getElementById('result').style.display='none';
    document.getElementById('question').style.display='block';
  }
</script>
</body>
</html>
